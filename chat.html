<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — OpenFlow</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">

<header class="masthead">
  <h1 class="wordmark"><a href="index.html">Open<span>Flow</span></a></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="toggle-setup">Setup</a>
    <a href="#" id="new-chat">New</a>
  </nav>
</header>

<main class="shell chat-shell">

  <!-- ---------------------------------------------------------- setup ---->
  <section class="panel" id="setup">
    <div class="row">
      <div class="grow">
        <label for="key">Your key</label>
        <input id="key" placeholder="of_live_…" autocomplete="off">
      </div>
      <div class="grow">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
    </div>

    <label for="system">System prompt — the agent's standing instructions</label>
    <textarea id="system" rows="3" placeholder="You are a terse assistant that answers in plain language."></textarea>

    <div class="row" style="margin-top:0.9rem">
      <div>
        <label for="temp" style="margin-top:0">Temperature</label>
        <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7" style="width:6.5rem">
      </div>
      <div>
        <label for="maxtok" style="margin-top:0">Max tokens</label>
        <input id="maxtok" type="number" min="1" step="64" placeholder="default" style="width:8rem">
      </div>
    </div>

    <div class="row" style="margin-top:1.1rem">
      <button type="button" id="save-setup">Save</button>
      <button class="ghost" type="button" id="copy-json">Copy conversation JSON</button>
      <button class="ghost" type="button" id="forget">Forget key</button>
    </div>

    <p class="alert" id="setup-alert" hidden></p>
    <p class="note" style="margin-top:1rem">
      Nothing here leaves your browser except the API call itself. The key is
      kept locally so you don't retype it.
    </p>
  </section>

  <!-- -------------------------------------------------------- messages ---->
  <section id="thread" class="thread">
    <p class="empty" id="empty">
      Pick a model, paste a key, and say something.<br>
      <span class="dim">Conversations stay in this browser. Nothing is stored on the server.</span>
    </p>
  </section>

  <!-- -------------------------------------------------------- composer ---->
  <section class="composer">
    <textarea id="say" rows="2" placeholder="Message…  (Enter sends, Shift+Enter for a new line)"></textarea>
    <div class="composer-actions">
      <button type="button" id="send">Send</button>
      <button class="ghost tiny" type="button" id="stop" hidden>Stop</button>
      <button class="ghost tiny" type="button" id="regen">Regenerate</button>
      <button class="ghost tiny" type="button" id="undo">Undo</button>
    </div>
    <p class="meta" id="stats"></p>
  </section>

</main>

<script src="config.js?v=2caae557"></script>
<script>
const CFG = window.OPENFLOW;
const API = CFG.api.replace(/\/+$/, "");
const MODELS = CFG.models || [];

/* ------------------------------------------------------------ tiny store */

const store = {
  _m: {},
  get(k) { try { return localStorage.getItem(k); } catch (e) { return this._m[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this._m[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete this._m[k]; } },
};

const $ = (id) => document.getElementById(id);

/* ----------------------------------------------------------------- state */

let history = [];
let controller = null;

function loadState() {
  $("key").value = store.get("openflow.key") || "";
  $("system").value = store.get("openflow.system") || "";
  $("temp").value = store.get("openflow.temp") || "0.7";
  $("maxtok").value = store.get("openflow.maxtok") || "";
  try { history = JSON.parse(store.get("openflow.thread") || "[]"); } catch (e) { history = []; }
}

function saveThread() {
  store.set("openflow.thread", JSON.stringify(history));
}

/* ---------------------------------------------------------------- models */

function fillModels() {
  const picker = $("model");
  picker.innerHTML = "";
  for (const m of MODELS) {
    if ((m.kind || "chat") !== "chat") continue;   // video has its own endpoint
    const option = document.createElement("option");
    option.value = m.id;
    option.textContent = m.id + "  ·  " + m.limit;
    picker.appendChild(option);
  }
  const saved = store.get("openflow.model");
  if (saved && MODELS.some((m) => m.id === saved)) picker.value = saved;
}

/* -------------------------------------------------------------- markdown */

/* Deliberately small. Escapes everything first, then re-introduces only
   fenced code, inline code, bold and italics. No raw HTML ever renders. */
function render(text) {
  const safe = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const blocks = [];
  let out = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre class="code" data-lang="' + lang + '">' + code.replace(/\n$/, "") + "</pre>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });

  out = out
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\n/g, "<br>");

  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* ---------------------------------------------------------------- thread */

function draw() {
  const thread = $("thread");
  thread.innerHTML = "";

  if (!history.length) {
    thread.innerHTML =
      '<p class="empty">Pick a model, paste a key, and say something.<br>' +
      '<span class="dim">Conversations stay in this browser. Nothing is ' +
      'stored on the server.</span></p>';
    return;
  }

  history.forEach((message, index) => {
    const el = document.createElement("article");
    el.className = "msg";
    el.dataset.role = message.role;

    const who = document.createElement("p");
    who.className = "who";
    who.textContent = message.role === "user" ? "you" : (message.model || "assistant");
    el.appendChild(who);

    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = render(message.content);
    el.appendChild(body);

    const tools = document.createElement("div");
    tools.className = "msg-tools";

    const copy = document.createElement("button");
    copy.className = "ghost tiny";
    copy.type = "button";
    copy.textContent = "Copy";
    copy.onclick = () => navigator.clipboard.writeText(message.content);
    tools.appendChild(copy);

    if (message.role === "user") {
      const again = document.createElement("button");
      again.className = "ghost tiny";
      again.type = "button";
      again.textContent = "Edit";
      again.onclick = () => {
        $("say").value = message.content;
        history = history.slice(0, index);
        saveThread();
        draw();
        $("say").focus();
      };
      tools.appendChild(again);
    }

    el.appendChild(tools);
    thread.appendChild(el);
  });

  thread.scrollTop = thread.scrollHeight;
}

function note(text, good = false) {
  const el = $("setup-alert");
  el.textContent = text;
  el.classList.toggle("good", good);
  el.hidden = !text;
}

/* ------------------------------------------------------------------ send */

async function ask() {
  const key = $("key").value.trim();
  const model = $("model").value;
  const text = $("say").value.trim();

  if (!key) { $("setup").hidden = false; note("Paste your OpenFlow key first."); return; }
  if (!text) return;

  store.set("openflow.key", key);
  store.set("openflow.model", model);

  history.push({ role: "user", content: text });
  $("say").value = "";
  saveThread();
  draw();

  const messages = [];
  const system = $("system").value.trim();
  if (system) messages.push({ role: "system", content: system });
  for (const m of history) messages.push({ role: m.role, content: m.content });

  const body = { model, messages, stream: true };
  const temp = parseFloat($("temp").value);
  if (!Number.isNaN(temp)) body.temperature = temp;
  const maxtok = parseInt($("maxtok").value, 10);
  if (!Number.isNaN(maxtok) && maxtok > 0) body.max_tokens = maxtok;

  const reply = { role: "assistant", content: "", model };
  history.push(reply);
  draw();

  const bubble = $("thread").lastElementChild.querySelector(".body");
  bubble.innerHTML = '<span class="caret"></span>';

  $("send").disabled = true;
  $("stop").hidden = false;
  $("stats").textContent = "waiting…";

  const began = performance.now();
  let first = null;
  controller = new AbortController();

  try {
    const res = await fetch(API + "/v1/chat/completions", {
      method: "POST",
      signal: controller.signal,
      headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const detail = await res.json().catch(() => null);
      reply.content = detail?.error?.message || ("HTTP " + res.status);
      reply.failed = true;
      draw();
      $("thread").lastElementChild.dataset.role = "error";
      $("stats").textContent = "";
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const piece = JSON.parse(payload).choices?.[0]?.delta?.content;
          if (!piece) continue;
          if (first === null) first = performance.now() - began;
          reply.content += piece;
          bubble.innerHTML = render(reply.content) + '<span class="caret"></span>';
          $("thread").scrollTop = $("thread").scrollHeight;
        } catch (e) { /* partial frame */ }
      }
    }

    bubble.innerHTML = render(reply.content);
    const total = (performance.now() - began) / 1000;
    $("stats").textContent = reply.content.length + " chars · " +
      (first !== null ? (first / 1000).toFixed(1) + "s to first token · " : "") +
      total.toFixed(1) + "s";
  } catch (err) {
    if (err.name === "AbortError") {
      bubble.innerHTML = render(reply.content || "(stopped)");
      $("stats").textContent = "stopped";
    } else {
      reply.content = "Couldn't reach the gateway: " + err.message;
      reply.failed = true;
      draw();
      $("thread").lastElementChild.dataset.role = "error";
    }
  } finally {
    controller = null;
    $("send").disabled = false;
    $("stop").hidden = true;
    if (reply.failed) history.pop();      // don't poison the next turn
    saveThread();
  }
}

/* --------------------------------------------------------------- wiring */

$("send").addEventListener("click", ask);

$("stop").addEventListener("click", () => { if (controller) controller.abort(); });

$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});

$("regen").addEventListener("click", () => {
  while (history.length && history[history.length - 1].role === "assistant") history.pop();
  const last = history.pop();
  if (!last) return;
  $("say").value = last.content;
  saveThread();
  draw();
  ask();
});

$("undo").addEventListener("click", () => {
  history.pop();
  if (history.length && history[history.length - 1].role === "user") history.pop();
  saveThread();
  draw();
});

$("new-chat").addEventListener("click", (e) => {
  e.preventDefault();
  history = [];
  saveThread();
  draw();
  $("stats").textContent = "";
});

$("toggle-setup").addEventListener("click", (e) => {
  e.preventDefault();
  $("setup").hidden = !$("setup").hidden;
});

$("save-setup").addEventListener("click", () => {
  store.set("openflow.key", $("key").value.trim());
  store.set("openflow.system", $("system").value);
  store.set("openflow.temp", $("temp").value);
  store.set("openflow.maxtok", $("maxtok").value);
  store.set("openflow.model", $("model").value);
  note("Saved.", true);
  setTimeout(() => { $("setup").hidden = true; note(""); }, 700);
});

$("copy-json").addEventListener("click", () => {
  const messages = [];
  const system = $("system").value.trim();
  if (system) messages.push({ role: "system", content: system });
  for (const m of history) messages.push({ role: m.role, content: m.content });
  navigator.clipboard.writeText(JSON.stringify(messages, null, 2)).then(
    () => note("Messages array copied — paste it straight into your agent.", true),
    () => note("Copy failed."));
});

$("forget").addEventListener("click", () => {
  store.del("openflow.key");
  $("key").value = "";
  note("Key forgotten.", true);
});

/* ----------------------------------------------------------------- start */

fillModels();
loadState();
draw();
if (!$("key").value) $("setup").hidden = false; else $("setup").hidden = true;
</script>
</body>
</html>
